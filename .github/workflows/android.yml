name: Carplex Android APK

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android project files
        run: |
          flutter create --platforms=android --org app.carplex --project-name carplex "$RUNNER_TEMP/carplex"
          cp -R "$RUNNER_TEMP/carplex/android" .

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: carplex-test-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
